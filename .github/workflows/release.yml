name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            npm run build
            npx electron-builder --mac --publish always
          elif [ "$RUNNER_OS" == "Windows" ]; then
            npm run build
            npx electron-builder --win --publish always
          else
            echo "Building for Linux"
            npm run build
            npx electron-builder --linux --publish always
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          gh release edit "v$VERSION" --repo ${{ github.repository }} --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-tap:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download artifacts from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          gh release download "v$VERSION" --repo ${{ github.repository }} --pattern "*.dmg" --dir .
          ls -R

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: blue1st
          repositories: homebrew-taps

      - name: Update Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          chmod +x ./scripts/update-homebrew.sh
          ./scripts/update-homebrew.sh
